# FocusGuard local infrastructure (ROADMAP Phase 0).
#   docker compose -f infra/docker-compose.yml up -d                    # postgres + mailpit
#   docker compose -f infra/docker-compose.yml --profile redis up -d    # + redis      (Phase 3)
#   docker compose -f infra/docker-compose.yml --profile kafka up -d    # + kafka      (Phase 4)
name: focusguard

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: focusguard
      POSTGRES_PASSWORD: focusguard
      POSTGRES_DB: focusguard
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U focusguard -d focusguard']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # web UI
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # --- Reserved for later phases (profiles keep them off by default) ---
  redis:
    profiles: ['redis']
    image: redis:7.4
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
